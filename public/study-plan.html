<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kế Hoạch Học Tập</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-blue-900 via-blue-800 to-indigo-900 min-h-screen text-slate-800 font-sans p-4 sm:p-6 md:p-10">

    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <header class="text-center mb-8">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-white tracking-wide mb-2">
                <i class="fa-solid fa-graduation-cap text-blue-300 mr-2"></i> Lập Kế Hoạch Học Tập
            </h1>
            <p class="text-blue-200 text-sm sm:text-base">Lựa chọn môn học và phân bổ thời gian hiệu quả trong ngày</p>
        </header>

        <!-- Main Card -->
        <div class="bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl p-6 sm:p-8 border border-white/20">
            <form id="plannerForm" onsubmit="handleSubmit(event)">
                
                <!-- BƯỚC 1: CHỌN MÔN HỌC -->
                <div class="mb-8">
                    <div class="flex items-center space-x-3 mb-4">
                        <span class="w-8 h-8 rounded-full bg-blue-600 text-white font-bold flex items-center justify-center text-sm shadow">1</span>
                        <h2 class="text-xl font-bold text-blue-900">Chọn môn học</h2>
                    </div>

                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                        <!-- Môn Toán -->
                        <label class="relative flex flex-col items-center p-4 rounded-xl border-2 border-slate-200 bg-slate-50 cursor-pointer hover:border-blue-400 hover:bg-blue-50 transition-all text-center group">
                            <input type="checkbox" name="subject" value="toan" class="hidden peer" onchange="resetStep2()">
                            <div class="w-12 h-12 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-xl mb-2 group-hover:scale-110 transition-transform peer-checked:bg-blue-600 peer-checked:text-white">
                                <i class="fa-solid fa-calculator"></i>
                            </div>
                            <span class="font-semibold text-slate-700 peer-checked:text-blue-700">Toán</span>
                            <div class="absolute top-2 right-2 hidden peer-checked:block text-blue-600">
                                <i class="fa-solid fa-circle-check"></i>
                            </div>
                        </label>

                        <!-- Môn Vật Lý -->
                        <label class="relative flex flex-col items-center p-4 rounded-xl border-2 border-slate-200 bg-slate-50 cursor-pointer hover:border-blue-400 hover:bg-blue-50 transition-all text-center group">
                            <input type="checkbox" name="subject" value="li" class="hidden peer" onchange="resetStep2()">
                            <div class="w-12 h-12 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-xl mb-2 group-hover:scale-110 transition-transform peer-checked:bg-blue-600 peer-checked:text-white">
                                <i class="fa-solid fa-atom"></i>
                            </div>
                            <span class="font-semibold text-slate-700 peer-checked:text-blue-700">Vật lý</span>
                            <div class="absolute top-2 right-2 hidden peer-checked:block text-blue-600">
                                <i class="fa-solid fa-circle-check"></i>
                            </div>
                        </label>

                        <!-- Môn Hóa Học -->
                        <label class="relative flex flex-col items-center p-4 rounded-xl border-2 border-slate-200 bg-slate-50 cursor-pointer hover:border-blue-400 hover:bg-blue-50 transition-all text-center group">
                            <input type="checkbox" name="subject" value="hoa" class="hidden peer" onchange="resetStep2()">
                            <div class="w-12 h-12 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-xl mb-2 group-hover:scale-110 transition-transform peer-checked:bg-blue-600 peer-checked:text-white">
                                <i class="fa-solid fa-flask"></i>
                            </div>
                            <span class="font-semibold text-slate-700 peer-checked:text-blue-700">Hóa học</span>
                            <div class="absolute top-2 right-2 hidden peer-checked:block text-blue-600">
                                <i class="fa-solid fa-circle-check"></i>
                            </div>
                        </label>
<!-- Môn Tiếng Anh -->
                        <label class="relative flex flex-col items-center p-4 rounded-xl border-2 border-slate-200 bg-slate-50 cursor-pointer hover:border-blue-400 hover:bg-blue-50 transition-all text-center group">
                            <input type="checkbox" name="subject" value="anh" class="hidden peer" onchange="resetStep2()">
                            <div class="w-12 h-12 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-xl mb-2 group-hover:scale-110 transition-transform peer-checked:bg-blue-600 peer-checked:text-white">
                                <i class="fa-solid fa-language"></i>
                            </div>
                            <span class="font-semibold text-slate-700 peer-checked:text-blue-700">Tiếng Anh</span>
                            <div class="absolute top-2 right-2 hidden peer-checked:block text-blue-600">
                                <i class="fa-solid fa-circle-check"></i>
                            </div>
                        </label>
                        <!-- Môn Ngữ văn -->
                        <label class="relative flex flex-col items-center p-4 rounded-xl border-2 border-slate-200 bg-slate-50 cursor-pointer hover:border-blue-400 hover:bg-blue-50 transition-all text-center group">
                            <input type="checkbox" name="subject" value="van" class="hidden peer" onchange="resetStep2()">
                            <div class="w-12 h-12 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-xl mb-2 group-hover:scale-110 transition-transform peer-checked:bg-blue-600 peer-checked:text-white">
                                <i class="fa-solid fa-book-open"></i>
                            </div>
                            <span class="font-semibold text-slate-700 peer-checked:text-blue-700 text-sm">Ngữ văn</span>
                            <div class="absolute top-2 right-2 hidden peer-checked:block text-blue-600">
                                <i class="fa-solid fa-circle-check"></i>
                            </div>
                        </label>
                        <!-- Môn Lịch sử -->
                        <label class="relative flex flex-col items-center p-4 rounded-xl border-2 border-slate-200 bg-slate-50 cursor-pointer hover:border-blue-400 hover:bg-blue-50 transition-all text-center group">
                            <input type="checkbox" name="subject" value="su" class="hidden peer" onchange="resetStep2()">
                            <div class="w-12 h-12 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-xl mb-2 group-hover:scale-110 transition-transform peer-checked:bg-blue-600 peer-checked:text-white">
                                <i class="fa-solid fa-landmark"></i>
                            </div>
                            <span class="font-semibold text-slate-700 peer-checked:text-blue-700 text-sm">Lịch sử</span>
                            <div class="absolute top-2 right-2 hidden peer-checked:block text-blue-600">
                                <i class="fa-solid fa-circle-check"></i>
                            </div>
                        </label>
                        <!-- Môn Địa lí -->
                        <label class="relative flex flex-col items-center p-4 rounded-xl border-2 border-slate-200 bg-slate-50 cursor-pointer hover:border-blue-400 hover:bg-blue-50 transition-all text-center group">
                            <input type="checkbox" name="subject" value="dia" class="hidden peer" onchange="resetStep2()">
                            <div class="w-12 h-12 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-xl mb-2 group-hover:scale-110 transition-transform peer-checked:bg-blue-600 peer-checked:text-white">
                                <i class="fa-solid fa-earth-asia"></i>
                            </div>
                            <span class="font-semibold text-slate-700 peer-checked:text-blue-700 text-sm">Địa lí</span>
                            <div class="absolute top-2 right-2 hidden peer-checked:block text-blue-600">
                                <i class="fa-solid fa-circle-check"></i>
                            </div>
                        </label>
                        <!-- Môn Sinh học -->
                        <label class="relative flex flex-col items-center p-4 rounded-xl border-2 border-slate-200 bg-slate-50 cursor-pointer hover:border-blue-400 hover:bg-blue-50 transition-all text-center group">
                            <input type="checkbox" name="subject" value="sinh" class="hidden peer" onchange="resetStep2()">
                            <div class="w-12 h-12 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-xl mb-2 group-hover:scale-110 transition-transform peer-checked:bg-blue-600 peer-checked:text-white">
                                <i class="fa-solid fa-dna"></i>
                            </div>
                            <span class="font-semibold text-slate-700 peer-checked:text-blue-700 text-sm">Sinh học</span>
                            <div class="absolute top-2 right-2 hidden peer-checked:block text-blue-600">
                                <i class="fa-solid fa-circle-check"></i>
                            </div>
                        </label>
                        <!-- Môn Tin học -->
                        <label class="relative flex flex-col items-center p-4 rounded-xl border-2 border-slate-200 bg-slate-50 cursor-pointer hover:border-blue-400 hover:bg-blue-50 transition-all text-center group">
                            <input type="checkbox" name="subject" value="tin" class="hidden peer" onchange="resetStep2()">
                            <div class="w-12 h-12 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-xl mb-2 group-hover:scale-110 transition-transform peer-checked:bg-blue-600 peer-checked:text-white">
                                <i class="fa-solid fa-laptop-code"></i>
                            </div>
                            <span class="font-semibold text-slate-700 peer-checked:text-blue-700 text-sm">Tin học</span>
                            <div class="absolute top-2 right-2 hidden peer-checked:block text-blue-600">
                                <i class="fa-solid fa-circle-check"></i>
                            </div>
                        </label>
                        <!-- Môn Giáo dục kinh tế và pháp luật -->
                        <label class="relative flex flex-col items-center p-4 rounded-xl border-2 border-slate-200 bg-slate-50 cursor-pointer hover:border-blue-400 hover:bg-blue-50 transition-all text-center group">
                            <input type="checkbox" name="subject" value="ktpl" class="hidden peer" onchange="resetStep2()">
                            <div class="w-12 h-12 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-xl mb-2 group-hover:scale-110 transition-transform peer-checked:bg-blue-600 peer-checked:text-white">
                                <i class="fa-solid fa-scale-balanced"></i>
                            </div>
                            <span class="font-semibold text-slate-700 peer-checked:text-blue-700 text-sm">Giáo dục kinh tế và pháp luật</span>
                            <div class="absolute top-2 right-2 hidden peer-checked:block text-blue-600">
                                <i class="fa-solid fa-circle-check"></i>
                            </div>
                        </label>
                        <!-- Môn Giáo dục quốc phòng và an ninh -->
                        <label class="relative flex flex-col items-center p-4 rounded-xl border-2 border-slate-200 bg-slate-50 cursor-pointer hover:border-blue-400 hover:bg-blue-50 transition-all text-center group">
                            <input type="checkbox" name="subject" value="gdqp" class="hidden peer" onchange="resetStep2()">
                            <div class="w-12 h-12 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-xl mb-2 group-hover:scale-110 transition-transform peer-checked:bg-blue-600 peer-checked:text-white">
                                <i class="fa-solid fa-shield-halved"></i>
                            </div>
                            <span class="font-semibold text-slate-700 peer-checked:text-blue-700 text-sm">Giáo dục quốc phòng và an ninh</span>
                            <div class="absolute top-2 right-2 hidden peer-checked:block text-blue-600">
                                <i class="fa-solid fa-circle-check"></i>
                            </div>
                        </label>
                        <!-- Môn Công nghệ -->
                        <label class="relative flex flex-col items-center p-4 rounded-xl border-2 border-slate-200 bg-slate-50 cursor-pointer hover:border-blue-400 hover:bg-blue-50 transition-all text-center group">
                            <input type="checkbox" name="subject" value="congnghe" class="hidden peer" onchange="resetStep2()">
                            <div class="w-12 h-12 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-xl mb-2 group-hover:scale-110 transition-transform peer-checked:bg-blue-600 peer-checked:text-white">
                                <i class="fa-solid fa-gears"></i>
                            </div>
                            <span class="font-semibold text-slate-700 peer-checked:text-blue-700 text-sm">Công nghệ</span>
                            <div class="absolute top-2 right-2 hidden peer-checked:block text-blue-600">
                                <i class="fa-solid fa-circle-check"></i>
                            </div>
                        </label>
                    </div>


                    <!-- [MỚI] CHỌN LỚP (BẮT BUỘC) - ngay sau phần chọn môn -->
                    <div class="mt-6">
                        <p class="text-sm font-semibold text-slate-600 mb-2">Bạn đang học lớp mấy? <span class="text-red-500">*</span></p>
                        <div class="grid grid-cols-3 gap-3">
                            <label class="cursor-pointer">
                                <input type="radio" name="grade" value="10" class="hidden peer" onchange="resetStep2()">
                                <div class="p-3 rounded-xl border-2 border-slate-200 bg-slate-50 text-center font-bold text-slate-700 hover:border-blue-400 hover:bg-blue-50 transition-all peer-checked:bg-blue-600 peer-checked:border-blue-600 peer-checked:text-white">Lớp 10</div>
                            </label>
                            <label class="cursor-pointer">
                                <input type="radio" name="grade" value="11" class="hidden peer" onchange="resetStep2()">
                                <div class="p-3 rounded-xl border-2 border-slate-200 bg-slate-50 text-center font-bold text-slate-700 hover:border-blue-400 hover:bg-blue-50 transition-all peer-checked:bg-blue-600 peer-checked:border-blue-600 peer-checked:text-white">Lớp 11</div>
                            </label>
                            <label class="cursor-pointer">
                                <input type="radio" name="grade" value="12" class="hidden peer" onchange="resetStep2()">
                                <div class="p-3 rounded-xl border-2 border-slate-200 bg-slate-50 text-center font-bold text-slate-700 hover:border-blue-400 hover:bg-blue-50 transition-all peer-checked:bg-blue-600 peer-checked:border-blue-600 peer-checked:text-white">Lớp 12</div>
                            </label>
                        </div>
                    </div>

                    <div id="step1Error" class="hidden mt-3 text-red-500 text-sm font-medium flex items-center">
                        <i class="fa-solid fa-circle-exclamation mr-1.5"></i> <span id="step1ErrorText">Vui lòng chọn ít nhất 1 môn học.</span>
                    </div>

                    <!-- Nút xác nhận chọn môn -->
                    <div class="mt-5 text-right">
                        <button type="button" onclick="confirmSubjects()" class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg shadow-md hover:shadow-lg transition-all flex items-center ml-auto">
                            <span>Xác nhận môn học</span>
                            <i class="fa-solid fa-arrow-right ml-2"></i>
                        </button>
                    </div>
                </div>

                <hr class="border-slate-200 mb-8">

                <!-- BƯỚC 2: PHÂN BỔ THỜI GIAN (ẨN CHO ĐẾN KHI XÁC NHẬN BƯỚC 1) -->
                <div id="step2Section" class="hidden">
                    <div class="flex items-center space-x-3 mb-4">
                        <span class="w-8 h-8 rounded-full bg-blue-600 text-white font-bold flex items-center justify-center text-sm shadow">2</span>
                        <div>
                            <h2 class="text-xl font-bold text-blue-900">Thiết lập thời gian học cho từng môn</h2>
                            <p class="text-xs text-slate-500">Mốc thời gian kết thúc phải trễ hơn mốc thời gian bắt đầu</p>
                        </div>
                    </div>
                    <!-- Container danh sách các ô môn học sẽ được sinh ra bởi JS -->
                    <div id="subjectList" class="space-y-4 mb-8"></div>

                    <!-- Nút Hoàn tất -->
                    <button type="submit" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-lg hover:shadow-xl transition-all text-base flex items-center justify-center">
                        <i class="fa-solid fa-check-circle mr-2"></i> Lưu kế hoạch học tập
                    </button>
                </div>

            </form>
        </div>
    </div>

    <script>
        const subjectMap = {
            'toan': { name: 'Toán', icon: 'fa-calculator', color: 'text-blue-600', bg: 'bg-blue-50' },
            'li': { name: 'Vật lý', icon: 'fa-atom', color: 'text-indigo-600', bg: 'bg-indigo-50' },
            'hoa': { name: 'Hóa học', icon: 'fa-flask', color: 'text-teal-600', bg: 'bg-teal-50' },
            'anh': { name: 'Tiếng Anh', icon: 'fa-language', color: 'text-cyan-600', bg: 'bg-cyan-50' },
            'van': { name: 'Ngữ văn', icon: 'fa-book-open', color: 'text-rose-600', bg: 'bg-rose-50' },
            'su': { name: 'Lịch sử', icon: 'fa-landmark', color: 'text-amber-600', bg: 'bg-amber-50' },
            'dia': { name: 'Địa lí', icon: 'fa-earth-asia', color: 'text-emerald-600', bg: 'bg-emerald-50' },
            'sinh': { name: 'Sinh học', icon: 'fa-dna', color: 'text-green-600', bg: 'bg-green-50' },
            'tin': { name: 'Tin học', icon: 'fa-laptop-code', color: 'text-violet-600', bg: 'bg-violet-50' },
            'ktpl': { name: 'Giáo dục kinh tế và pháp luật', icon: 'fa-scale-balanced', color: 'text-orange-600', bg: 'bg-orange-50' },
            'gdqp': { name: 'Giáo dục quốc phòng và an ninh', icon: 'fa-shield-halved', color: 'text-red-600', bg: 'bg-red-50' },
            'congnghe': { name: 'Công nghệ', icon: 'fa-gears', color: 'text-fuchsia-600', bg: 'bg-fuchsia-50' }
        };

        let selectedSubjectsList = [];

        // [MỚI] Quay lại từ "Đổi kế hoạch" thì chọn sẵn lớp và môn đã lưu
        document.addEventListener('DOMContentLoaded', function () {
            try {
                const g = localStorage.getItem('userGrade');
                const r = g && document.querySelector(`input[name="grade"][value="${g}"]`);
                if (r) r.checked = true;
                (JSON.parse(localStorage.getItem('userSelectedSubjects')) || []).forEach(code => {
                    const c = document.querySelector(`input[name="subject"][value="${code}"]`);
                    if (c) c.checked = true;
                });
            } catch (e) {}
        });

        function resetStep2() {
            document.getElementById('step2Section').classList.add('hidden');
            document.getElementById('step1Error').classList.add('hidden');
        }

        function confirmSubjects() {
            const checkedBoxes = document.querySelectorAll('input[name="subject"]:checked');
            const errorEl = document.getElementById('step1Error');
            
            if (checkedBoxes.length === 0) {
                document.getElementById('step1ErrorText').textContent = 'Vui lòng chọn ít nhất 1 môn học.';
                errorEl.classList.remove('hidden');
                document.getElementById('step2Section').classList.add('hidden');
                return;
            }

            // [MỚI] bắt buộc chọn lớp
            if (!document.querySelector('input[name="grade"]:checked')) {
                document.getElementById('step1ErrorText').textContent = 'Vui lòng chọn lớp của bạn.';
                errorEl.classList.remove('hidden');
                document.getElementById('step2Section').classList.add('hidden');
                return;
            }

            errorEl.classList.add('hidden');
            selectedSubjectsList = Array.from(checkedBoxes).map(cb => cb.value);

            renderSubjectForms(selectedSubjectsList);
            document.getElementById('step2Section').classList.remove('hidden');
            
            // Smooth scroll down to step 2
            document.getElementById('step2Section').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

        function renderSubjectForms(subjects) {
            const container = document.getElementById('subjectList');
            container.innerHTML = '';

            subjects.forEach(code => {
                const info = subjectMap[code];
                const card = document.createElement('div');
                card.className = "p-5 rounded-xl border border-slate-200 bg-slate-50/50 hover:bg-white hover:shadow-md transition-all";
                
                card.innerHTML = `
                    <div class="flex items-center space-x-3 mb-4">
                        <div class="w-10 h-10 rounded-lg ${info.bg} ${info.color} flex items-center justify-center font-bold">
                            <i class="fa-solid ${info.icon} text-lg"></i>
                        </div>
                        <h3 class="font-bold text-slate-800 text-lg">${info.name}</h3>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">
                                Thời gian bắt đầu <span class="text-red-500">*</span>
                            </label>
                            <input type="time" id="start_${code}" required
                                class="w-[#100%] w-full px-3 py-2 bg-white border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-slate-700 font-medium">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">
                                Thời gian kết thúc <span class="text-red-500">*</span>
                            </label>
                            <input type="time" id="end_${code}" required
                                class="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-slate-700 font-medium">
                        </div>
                    </div>

                    <div class="mt-3">
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Ghi chú / Nội dung học</label>
                        <input type="text" placeholder="Ví dụ: Làm bài tập chương 3..." 
                            class="w-full px-3 py-1.5 bg-white border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                    </div>

                    <div id="error_${code}" class="hidden mt-2 text-xs font-semibold text-red-500">
<i class="fa-solid fa-triangle-exclamation mr-1"></i> Thời gian kết thúc phải trễ hơn thời gian bắt đầu!
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function handleSubmit(e) {
            e.preventDefault();
            let isValid = true;
            const studyPlanData = {}; // Đối tượng lưu thông tin chi tiết từng môn

            selectedSubjectsList.forEach(code => {
                const startVal = document.getElementById(`start_${code}`).value;
                const endVal = document.getElementById(`end_${code}`).value;
                const noteInput = event.target.querySelector(`input[id="start_${code}"]`)?.closest('.p-5').querySelector('input[type="text"]') 
                          || document.querySelector(`#start_${code}`).closest('.p-5').querySelector('input[type="text"]');
                const noteVal = noteInput ? noteInput.value : '';
                const errorEl = document.getElementById(`error_${code}`);
            
                if (startVal && endVal) {
                    if (startVal >= endVal) {
                        errorEl.classList.remove('hidden');
                        isValid = false;
                    } else {
                        errorEl.classList.add('hidden');
                        // Lưu dữ liệu thời gian và ghi chú vào object
                        studyPlanData[code] = {
                            start: startVal,
                            end: endVal,
                            note: noteVal
                        };
                    }
                } else {
                    isValid = false;
                }
            });
        
            if (isValid) {
                // 1. Lưu danh sách mã môn để check điều kiện đã lập kế hoạch chưa
                localStorage.setItem('userSelectedSubjects', JSON.stringify(selectedSubjectsList));

                // [MỚI] Lưu lớp đã chọn để trang study và AI dùng
                localStorage.setItem('userGrade', document.querySelector('input[name="grade"]:checked').value);

                // 2. Lưu chi tiết thời gian & ghi chú để trang study hiển thị lại
                localStorage.setItem('userStudyPlanDetails', JSON.stringify(studyPlanData));

                // 3. Đánh dấu trạng thái người dùng đã hoàn thành việc thiết lập kế hoạch
                localStorage.setItem('hasCompletedPlan', 'true');
            
                // 4. Chuyển hướng sang trang học tập
                window.location.href = 'study.html';
            }
        }
    </script>
</body>
</html>
